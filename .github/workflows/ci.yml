name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALKOR_HOST: ${{ secrets.FALKOR_HOST }}
      FALKOR_PORT: ${{ secrets.FALKOR_PORT }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify required env vars
        run: |
          if [ -z "${FALKOR_HOST:-}" ]; then echo "FALKOR_HOST missing" && exit 1; else echo "FALKOR_HOST set"; fi
          if [ -z "${FALKOR_PORT:-}" ]; then echo "FALKOR_PORT missing" && exit 1; else echo "FALKOR_PORT set"; fi

      - name: Run tests
        run: pytest -q
